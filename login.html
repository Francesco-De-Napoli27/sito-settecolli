<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Area Riservata - Polisportiva Acli Settecolli</title>
    <link rel="icon" href="images/Logo nuovo Settecolli_favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #060919;
            color: #ffffff;
            margin: 0;
            padding-top: 80px;
        }
        .auth-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background-color: #0d1326;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .auth-container h2 {
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .form-group input {
            width: 100%;
            background-color: #111832;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 14px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }
        .btn-primary {
            background-color: #ff2800;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background-color: #cc2000;
        }
        .btn-secondary {
            background-color: transparent;
            color: #cccccc;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            background-color: #111832;
            color: #ffffff;
        }
    </style>
</head>
<body class="not-top-page">



    <div id="navbar-container"></div>




<div class="auth-container">
    <h2>Accesso Area Riservata</h2>
    <p style="text-align: center; color: #cccccc; margin-bottom: 30px;">Inserisci le tue credenziali per accedere.</p>

    <form id="auth-form" onsubmit="event.preventDefault();">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Inserisci la tua email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Inserisci la tua password" required>
        </div>

        <div class="form-group" id="register-extra" style="display: none;">
            <label for="confirm-password">Conferma Password</label>
            <input type="password" id="confirm-password" placeholder="Ripeti la password">
        </div>

        <div class="auth-buttons">
            <button type="button" class="btn-primary" id="main-action-btn" onclick="login()">Accedi</button>
            <button type="button" class="btn-secondary" onclick="toggleRegisterMode()">Non hai un account? Registrati</button>
        </div>
    </form>
</div>

<!-- SCRIPT FIREBASE & LOGICA -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDRf3Q_-D7nsVIPKSxxIm78rz1Nn5QY1cQ",
    authDomain: "settecollisite.firebaseapp.com",
    projectId: "settecollisite",
    storageBucket: "settecollisite.firebasestorage.app",
    messagingSenderId: "928590715316",
    appId: "1:928590715316:web:031eae061e38bd5ef9bae1",
    measurementId: "G-HG7C6G0ZPV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isRegistering = false;

  window.toggleRegisterMode = function() {
    isRegistering = !isRegistering;
    const extra = document.getElementById("register-extra");
    const btn = document.getElementById("main-action-btn");
    
    if (isRegistering) {
      extra.style.display = "block";
      document.getElementById("confirm-password").required = true;
      btn.innerText = "Registrati";
      event.target.innerText = "Hai già un account? Accedi";
    } else {
      extra.style.display = "none";
      document.getElementById("confirm-password").required = false;
      btn.innerText = "Accedi";
      event.target.innerText = "Non hai un account? Registrati";
    }
  };

  window.login = async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (isRegistering) {
      const confirmPassword = document.getElementById("confirm-password").value;
      if (password !== confirmPassword) {
        alert("Le password non coincidono!");
        return;
      }
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        // Salviamo come ruolo predefinito "tifoso" su Firestore usando la proprietà "role" coerente con il router
        await setDoc(doc(db, "users", userCredential.user.uid), {
          email: email,
          role: "tifoso",
          primoAccesso: true
        });
        alert("Registrazione completata con successo!");
        window.location.href = "area-riservata.html"; // Invia al router di smistamento
      } catch (error) {
        alert("Errore di registrazione: " + error.message);
      }
    } else {
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "area-riservata.html"; // Invia al router di smistamento
      } catch (error) {
        alert("Errore di accesso: " + error.message);
      }
    }
  };
</script>


<div id="footer-container"></div>

    <!-- SCRIPT -->
    <script src="script.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="i18n.js"></script>


</body>
</html>
