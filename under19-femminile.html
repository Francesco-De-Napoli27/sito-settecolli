<!DOCTYPE html>

<head>

    <style>
        /* Stili specifici per la pagina Under 15 Femminile */
        body {
            background-color: #060919;
            color: #ffffff;
            margin: 0;
            padding-top: 50px; /* Spazio per la navbar fissa */
        }

        /* Hero Header */
        .u15-hero {
            position: relative;
            width: 100%;
            height: 500px;
            background: url('images/hero.png') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 40px;
        }

        .u15-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(6,9,25,0.95) 0%, rgba(6,9,25,0.3) 100%);
        }

        .u15-hero-content {
            position: relative;
            z-index: 2;
        }

        .u15-hero h1 {
            font-size: 3.2rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
            color: #ffffff;
        }

        .u15-hero p {
            font-size: 1.3rem;
            text-transform: uppercase;
            font-weight: 800;
            color: #ff2800;
            margin: 5px 0 0 0;
            letter-spacing: 1px;
        }

        /* Contenitore Griglie */
        .u15-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .section-title {
            font-size: 2.2rem;
            text-transform: uppercase;
            font-weight: 900;
            border-bottom: 3px solid #ff2800;
            padding-bottom: 10px;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 60px;
        }

        .player-card {
            background-color: #0d1326;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.3s, border-color 0.3s;
        }

        .player-card:hover {
            transform: translateY(-5px);
            border-color: #ff2800;
        }

        .player-image-container {
            width: 100%;
            height: 300px;
            background-color: #111832;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .player-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        .player-info {
            width: 100%;
            padding: 20px;
            display: flex;
            align-items: center;
            background-color: #0d1326;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ff2800;
            margin-right: 20px;
            line-height: 1;
        }

        .player-details {
            text-align: left;
        }

        .player-name {
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #ffffff;
            margin: 0 0 4px 0;
        }

        .player-role {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #aaaaaa;
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .players-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .players-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
