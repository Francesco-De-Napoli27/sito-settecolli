<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria Amatoriale - Polisportiva Acli Settecolli</title>
    <link rel="icon" href="images/Logo nuovo Settecolli_favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #060919;
            color: #ffffff;
            margin: 0;
            padding-top: 80px;
        }

        .gallery-hero {
            background-color: #060919;
            padding: 50px 40px;
            text-align: left;
            border-bottom: 2px solid #ff2800;
        }

        .gallery-hero h1 {
            max-width: 1300px;
            margin: 0 auto;
            font-size: 3rem;
            text-transform: uppercase;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .gallery-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 50px;
        }

        .category-card {
            background-color: #0d1326;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: #ff2800;
        }

        .category-img-container {
            width: 100%;
            height: 220px;
            background-color: #111832;
            overflow: hidden;
        }

        .category-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .category-card:hover .category-img-container img {
            transform: scale(1.05);
        }

        .category-info {
            padding: 20px;
            background-color: #060919;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .category-info h3 {
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 800;
            margin: 0;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .back-btn-container {
            margin: 40px 0 20px 0;
        }

        .back-btn {
            display: inline-block;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 24px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background-color: #ff2800;
            border-color: #ff2800;
        }

        @media (max-width: 992px) {
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .category-grid {
                grid-template-columns: 1fr;
            }
            .gallery-hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body class="not-top-page">

    <div id="navbar-container"></div>


    <!-- HERO HEADER -->
    <section class="gallery-hero">
        <h1>Gallerie Amatoriale</h1>
    </section>

    <!-- CONTENUTO PRINCIPALE: GRIGLIA SQUADRE AMATORIALI -->
    <div class="gallery-container">
        <div class="category-grid">
            <!-- Amatoriale Giovani -->
            <a href="galleria-amatoriale-giovani.html" class="category-card">
                <div class="category-img-container">
                    <img src="images/staff1.png" alt="Amatoriale Giovani">
                </div>
                <div class="category-info">
                    <h3>Amatoriale Giovani</h3>
                </div>
            </a>

            <!-- Amatoriale Grandi -->
            <a href="galleria-amatoriale-grandi.html" class="category-card">
                <div class="category-img-container">
                    <img src="images/staff2.png" alt="Amatoriale Grandi">
                </div>
                <div class="category-info">
                    <h3>Amatoriale Grandi</h3>
                </div>
            </a>
        </div>


        <!-- Pulsante Torna Indietro -->
        <div class="back-btn-container">
            <a href="index.html" class="back-btn">Torna Indietro</a>
        </div>
    </div>

   <div id="footer-container"></div>

    <!-- SCRIPT -->
    <script src="script.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
