<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria Giocatori Maschile - Polisportiva Acli Settecolli</title>
    <link rel="icon" href="images/Logo nuovo Settecolli_favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Stili specifici per la Galleria Giocatori */
        body {
            background-color: #060919;
            color: #ffffff;
            margin: 0;
            padding-top: 50px; /* Spazio per la navbar fissa */
        }

        /* Hero Header */
        .gallery-hero {
            background-color: #060919;
            padding: 50px 40px;
            text-align: left;
            border-bottom: 2px solid #ff2800;
        }

        .gallery-hero h1 {
            max-width: 1300px;
            margin: 0 auto;
            font-size: 3rem;
            text-transform: uppercase;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
        }

        /* Contenitore Griglia Giocatori */
        .gallery-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-bottom: 50px;
        }

        .player-card {
            background-color: #0d1326;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
        }

        .player-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 40, 0, 0.5);
        }

        .player-img-container {
            width: 100%;
            height: 320px;
            background-color: #111832;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .player-info {
            padding: 20px;
            background-color: #060919;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .player-info h3 {
            font-size: 1.1rem;
            text-transform: uppercase;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            letter-spacing: 1px;
        }

        /* Pulsante Torna Indietro */
        .back-btn-container {
            margin: 40px 0 20px 0;
        }

        .back-btn {
            display: inline-block;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 24px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background-color: #ff2800;
            border-color: #ff2800;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .player-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .player-grid {
                grid-template-columns: 1fr;
            }
            .gallery-hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body class="not-top-page">

    <div id="navbar-container"></div>



    <!-- HERO HEADER -->
    <section class="gallery-hero">
        <h1>Gallerie Giocatori</h1>
    </section>

    <!-- CONTENUTO PRINCIPALE -->
    <div class="gallery-container">
        <div class="player-grid">
            <!-- Giocatore 1 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img src="images/staff1.png" alt="Giocatore">
                </div>
                <div class="player-info">
                    <h3>33 - Fabio Pastore</h3>
                </div>
            </div>

            <!-- Giocatore 2 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img src="images/staff2.png" alt="Giocatore">
                </div>
                <div class="player-info">
                    <h3>26 - Gabriele Potenza</h3>
                </div>
            </div>

            <!-- Giocatore 3 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img src="images/staff3.png" alt="Giocatore">
                </div>
                <div class="player-info">
                    <h3>23 - Andrea Massacesi</h3>
                </div>
            </div>

            <!-- Giocatore 4 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img src="images/staff1.png" alt="Giocatore">
                </div>
                <div class="player-info">
                    <h3>22 - Alessio Pettinato</h3>
                </div>
            </div>

            <!-- Giocatore 5 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img src="images/staff2.png" alt="Giocatore">
                </div>
                <div class="player-info">
                    <h3>17 - Luciano Avena</h3>
                </div>
            </div>

            <!-- Giocatore 6 -->
            <div class="player-card">
                <div class="player-img-container">
                    <img src="images/staff3.png" alt="Giocatore">
                </div>
                <div class="player-info">
                    <h3>15 - Manuel Altomare</h3>
                </div>
            </div>
        </div>

        <!-- Pulsante Torna Indietro -->
        <div class="back-btn-container">
            <a href="index.html" class="back-btn">Torna Indietro</a>
        </div>
    </div>

   <div id="footer-container"></div>

    <!-- SCRIPT -->
    <script src="script.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
