<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter - Polisportiva Acli Settecolli</title>
    <link rel="icon" href="images/Logo nuovo Settecolli_favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Stili specifici per la pagina Newsletter */
        body {
            background-color: #060919;
            color: #ffffff;
            margin: 0;
            padding-top: 50px; /* Spazio per la navbar fissa */
        }

        /* Hero Header Newsletter */
        .newsletter-hero {
            position: relative;
            width: 100%;
            height: 500px;
            background: url('images/hero.png') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            text-align: center;
            justify-content: center;
        }

        .newsletter-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(6,9,25,0.95) 0%, rgba(6,9,25,0.3) 100%);
        }

        .newsletter-hero-content {
            position: relative;
            z-index: 2;
        }

        .newsletter-hero h1 {
            font-size: 3.2rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .newsletter-hero p {
            font-size: 1.1rem;
            color: #ff2800;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 0;
        }

        /* Contenitore Principale e Form */
        .newsletter-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .newsletter-box {
            background-color: #0d1326;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 50px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .newsletter-box h2 {
            font-size: 1.8rem;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .newsletter-box p {
            color: #cccccc;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .newsletter-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .form-group input {
            background-color: #111832;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 14px;
            color: #ffffff;
            font-size: 1rem;
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        .submit-btn {
            background-color: #ff2800;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #cc2000;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .newsletter-hero h1 {
                font-size: 2.2rem;
            }
            .newsletter-box {
                padding: 25px;
            }
        }
    </style>
</head>
<body class="not-top-page">

    <div id="navbar-container"></div>




    <!-- HERO HEADER NEWSLETTER -->
    <section class="newsletter-hero">
        <div class="newsletter-hero-content">
            <h1>Rimani Aggiornato</h1>
            <p>Iscriviti alla Newsletter Ufficiale</p>
        </div>
    </section>

    <!-- CONTENUTO E FORM NEWSLETTER -->
    <div class="newsletter-container">
        <div class="newsletter-box">
            <h2>Non perdere nessuna notizia</h2>
            <p>Entra a far parte della nostra grande famiglia! Ricevi in anteprima gli aggiornamenti sulle partite, le iniziative del settore giovanile, le offerte dello shop e gli eventi esclusivi della Volley Acli Settecolli.</p>
            
            <form action="https://formspree.io/f/xdenokzk" method="POST" class="newsletter-form">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" placeholder="Il tuo nome" required>
                </div>
                <div class="form-group">
                    <label for="email">Indirizzo Email *</label>
                    <input type="email" id="email" placeholder="La tua email" required>
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="privacy" required>
                    <label for="privacy">Ho letto l'informativa sulla Privacy e acconsento al trattamento dei dati.</label>
                </div>
                <button type="submit" class="submit-btn">Iscriviti Ora</button>
            </form>
        </div>
    </div>

    <div id="footer-container"></div>

    <!-- SCRIPT -->
    <script src="script.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
