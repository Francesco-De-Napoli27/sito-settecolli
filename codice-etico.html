<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codice Etico - Polisportiva Acli Settecolli</title>
    <link rel="icon" href="images/Logo nuovo Settecolli_favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Stili specifici per la pagina Codice Etico */
        body {
            background-color: #ffffff; /* Sfondo pagina chiaro come nel riferimento */
            color: #111111;
            margin: 0;
            padding-top: 50px; /* Spazio per la navbar fissa */
        }

        /* Hero Header Blu */
        .etico-hero {
            background-color: #060919; /* Blu vibrante Trentino */
            color: #ffffff;
            padding: 80px 20px;
            text-align: center;
        }

        .etico-hero h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
        }

        .etico-hero p {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            color: #dddddd;
        }

        /* Contenitore Sezioni (2 Colonne) */
        .etico-container {
            max-width: 1000px;
            margin: 120px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 60px;
            text-align: center;
        }

        .etico-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .etico-box h2 {
            font-size: 1.6rem;
            text-transform: uppercase;
            font-weight: 900;
            color: #060919;
            margin-bottom: 5px;
        }

        .etico-box .subtitle {
            font-size: 0.95rem;
            color: #666666;
            margin-bottom: 30px;
        }

        .etico-box .person-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333333;
            margin-bottom: 15px;
        }

        /* Bottoni e Link */
        .btn-scarica-pdf {
            display: inline-block;
            border: 2px solid #060919;
            color: #060919;
            padding: 12px 30px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.85rem;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-scarica-pdf:hover {
            background-color: #ff2800;
            border-color: #ff2800;
            color: #ffffff;
        }

        .email-link {
            color: #002288;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.05rem;
            transition: color 0.3s ease;
        }

        .email-link:hover {
            color: #ff2800;
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .etico-container {
                grid-template-columns: 1fr;
                gap: 50px;
            }
            .etico-hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body class="not-top-page">

   <div id="navbar-container"></div>



    <!-- HERO BLUE BANNER -->
    <section class="etico-hero">
        <h1>Codice Etico</h1>
        <p>E Tutela dei Minori</p>
    </section>

    <!-- CONTENUTO SEZIONI -->
    <div class="etico-container">
        
        <!-- COLONNA 1: CODICE ETICO PDF -->
        <div class="etico-box">
            <h2>Codice Etico</h2>
            <div class="subtitle">di Polisportiva Acli Settecolli A.S.D.</div>
            <a href="documents/Codice_Etico_Settecolli.pdf" class="btn-scarica-pdf" download target="_blank">Scarica PDF</a>
        </div>

        <!-- COLONNA 2: RESPONSABLE SAFEGUARDING -->
        <div class="etico-box">
            <h2>Responsabile Safeguarding</h2>
            <div class="person-name">Dott. Pierfrancesco De Napoli</div>
            <a href="mailto:pierfrancescodenapoli@yahoo.it" class="email-link">pierfrancescodenapoli@yahoo.it</a>
        </div>

    </div>



    <div id="footer-container"></div>


    <!-- SCRIPT -->
    <script src="script.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="i18n.js"></script>

</body>
</html>
