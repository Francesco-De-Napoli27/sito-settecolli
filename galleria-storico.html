<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria Storico - Polisportiva Acli Settecolli</title>
    <link rel="icon" href="images/Logo nuovo Settecolli_favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #060919;
            color: #ffffff;
            margin: 0;
            padding-top: 50px;
        }

        .gallery-hero {
            background-color: #060919;
            padding: 50px 40px;
            text-align: left;
            border-bottom: 2px solid #ff2800;
        }

        .gallery-hero h1 {
            max-width: 1300px;
            margin: 0 auto;
            font-size: 3rem;
            text-transform: uppercase;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .gallery-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .match-album-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 50px;
        }

        .match-card {
            background-color: #0d1326;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        .match-card:hover {
            transform: translateY(-5px);
            border-color: #ff2800;
        }

        .match-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .match-info {
            padding: 20px;
        }

        .match-info h3 {
            font-size: 1.1rem;
            text-transform: uppercase;
            font-weight: 800;
            margin: 0 0 15px 0;
            color: #ffffff;
        }

        .download-btn {
            display: block;
            width: 100%;
            background-color: #ff2800;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background-color: #cc2000;
        }

        .back-btn-container {
            margin: 40px 0 20px 0;
        }

        .back-btn {
            display: inline-block;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 24px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background-color: #ff2800;
            border-color: #ff2800;
        }

        @media (max-width: 992px) {
            .match-album-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .match-album-grid {
                grid-template-columns: 1fr;
            }
            .gallery-hero h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body class="not-top-page">

    <div id="navbar-container"></div>



    <!-- HERO HEADER -->
    <section class="gallery-hero">
        <h1>Archivio Storico</h1>
    </section>

    <!-- CONTENUTO PRINCIPALE -->
    <div class="gallery-container">
        <div class="match-album-grid">
            <div class="match-card">
                <img src="images/storia-logo.png" alt="Storico" class="match-img">
                <div class="match-info">
                    <h3>1966/2024 - Le Origini del Club</h3>
                    <a href="images/storia-logo.png" download class="download-btn">Scarica Foto (HD)</a>
                </div>
            </div>
            <div class="match-card">
                <img src="images/staff1.png" alt="Storico" class="match-img">
                <div class="match-info">
                    <h3>Promozione in Serie D Maschile (2024/25)</h3>
                    <a href="images/staff1.png" download class="download-btn">Scarica Foto (HD)</a>
                </div>
            </div>
            <div class="match-card">
                <img src="images/staff2.png" alt="Storico" class="match-img">
                <div class="match-info">
                    <h3>Festa dei 60 Anni dalla Fondazione</h3>
                    <a href="images/staff2.png" download class="download-btn">Scarica Foto (HD)</a>
                </div>
            </div>
        </div>

        <!-- Pulsante Torna Indietro -->
        <div class="back-btn-container">
            <a href="index.html" class="back-btn">Torna Indietro</a>
        </div>
    </div>

   <div id="footer-container"></div>
   
    <!-- SCRIPT -->
    <script src="script.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
