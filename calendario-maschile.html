<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <link rel="icon" href="images/Logo nuovo Settecolli_favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Stili specifici per la pagina Calendario */
        body {
            background-color: #060919;
            color: #ffffff;
            margin: 0;
            padding-top: 80px; /* Spazio per la navbar fissa */
        }

        /* Hero Header */
        .calendar-hero {
            background-color: #060919;
            padding: 40px 20px 20px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .calendar-hero h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0 0 30px 0;
        }

        /* Tab Selettori Competizione */
        .competition-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .tab-btn {
            background: #0d1326;
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 6px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            line-height: 1.3;
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: #ffffff;
            color: #060919;
            border-color: #ffffff;
        }

        /* Contenitore Contenuti Calendario */
        .calendar-container {
            max-width: 1000px;
            margin: 40px auto 60px;
            padding: 0 20px;
        }

        .competition-section {
            display: none;
        }

        .competition-section.active {
            display: block;
        }

        .matchday-title {
            font-size: 1.5rem;
            text-transform: uppercase;
            font-weight: 900;
            color: #ffffff;
            margin: 40px 0 10px 0;
            border-left: 4px solid #ff2800;
            padding-left: 12px;
        }

        .matchday-date {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff2800;
            margin-bottom: 20px;
            margin-left: 16px;
        }

        /* Card Partita */
        .match-row {
            background-color: #ffffff;
            color: #111111;
            border-radius: 6px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .match-time {
            font-weight: 800;
            color: #002288;
            font-size: 0.95rem;
            width: 80px;
        }

        .match-teams {
            flex-grow: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        .match-vs {
            color: #888;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .match-score {
            font-weight: 900;
            font-size: 1.1rem;
            color: #002288;
            background: #f0f4ff;
            padding: 6px 15px;
            border-radius: 4px;
            letter-spacing: 2px;
            width: 60px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .match-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .match-teams {
                padding: 0;
                width: 100%;
                justify-content: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body class="not-top-page">

    <!-- SCRIPT CAMBIO COMPETIZIONE -->
    <script>
        function switchCompetition(compID) {
            // Rimuovi classe active da tutte le sezioni e bottoni
            document.querySelectorAll('.competition-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            // Attiva la sezione selezionata
            document.getElementById(compID).classList.add('active');
            event.currentTarget.classList.add('active');

            // Cambia titolo principale in alto
            const titles = {
                'campionato': 'Calendario Campionato',
                'coppa': 'Calendario Coppa',
            };
            document.getElementById('page-title').innerText = titles[compID];
        }
    </script>
