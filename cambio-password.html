<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio Password - Polisportiva Acli Settecolli</title>
    <link rel="icon" href="images/Logo nuovo Settecolli_favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #060919; color: #ffffff; margin: 0; padding-top: 80px; }
        .auth-container { max-width: 500px; margin: 50px auto; padding: 40px; background-color: #0d1326; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; }
        .auth-container h2 { text-transform: uppercase; text-align: center; margin-bottom: 25px; font-size: 1.8rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.9rem; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; color: #ffffff; }
        .form-group input { width: 100%; background-color: #111832; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; padding: 14px; color: #ffffff; box-sizing: border-box; }
        .btn-primary { width: 100%; background-color: #ff2800; color: #ffffff; border: none; padding: 15px; font-size: 1rem; font-weight: 900; text-transform: uppercase; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body class="not-top-page">

<div class="auth-container">
    <h2>Aggiorna Password</h2>
    <p style="text-align: center; color: #cccccc; margin-bottom: 30px;">È richiesto il cambio password per motivi di sicurezza.</p>

    <form id="password-form" onsubmit="event.preventDefault(); updatePassword();">
        <div class="form-group">
            <label for="new-password">Nuova Password</label>
            <input type="password" id="new-password" placeholder="Inserisci la nuova password" required>
        </div>
        <button type="submit" class="btn-primary">Salva e Continua</button>
    </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import { getAuth, updatePassword as fbUpdatePassword } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
  import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDRf3Q_-D7nsVIPKSxxIm78rz1Nn5QY1cQ",
    authDomain: "settecollisite.firebaseapp.com",
    projectId: "settecollisite",
    storageBucket: "settecollisite.firebasestorage.app",
    messagingSenderId: "928590715316",
    appId: "1:928590715316:web:031eae061e38bd5ef9bae1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.updatePassword = async function() {
    const newPass = document.getElementById("new-password").value;
    const user = auth.currentUser;

    if (!user) {
      alert("Utente non autenticato.");
      window.location.href = "login.html";
      return;
    }

    try {
      await fbUpdatePassword(user, newPass);
      // Imposta primoaccesso a false su Firestore
      await updateDoc(doc(db, "users", user.uid), {
        primoaccesso: false
      });

      alert("Password aggiornata con successo!");
      window.location.href = "area-riservata.html"; // Ritorna al router per smistare nell'area corretta
    } catch (error) {
      alert("Errore: " + error.message);
    }
  };
</script>

</body>
</html>
