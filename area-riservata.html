<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Redirect...</title>
</head>
<body>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDRf3Q_-D7nsVIPKSxxIm78rz1Nn5QY1cQ",
    authDomain: "settecollisite.firebaseapp.com",
    projectId: "settecollisite",
    storageBucket: "settecollisite.firebasestorage.app",
    messagingSenderId: "928590715316",
    appId: "1:928590715316:web:031eae061e38bd5ef9bae1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.replace("login.html");
      return;
    }

    try {
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);

      if (!snap.exists()) {
        window.location.replace("login.html");
        return;
      }

      const role = snap.data().role;

      if (role === "tifoso") {
        window.location.replace("area-tifoso.html");
      } else if (role === "atleta") {
        window.location.replace("area-atleta.html");
      } else if (role === "allenatore") {
        window.location.replace("area-allenatore.html");
      } else if (role === "dirigente") {
        window.location.replace("area-dirigente.html");
      } else {
        window.location.replace("login.html");
      }

    } catch (e) {
      console.error("Errore Firestore:", e);
      window.location.replace("login.html");
    }
  });
</script>

</body>
</html>
