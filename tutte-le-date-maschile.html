<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutte le Date Maschile - Polisportiva Acli Settecolli</title>
    <link rel="icon" href="images/Logo nuovo Settecolli_favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Stili specifici per la pagina Tutte le Date */
        body {
            background-color: #060919;
            color: #ffffff;
            margin: 0;
            padding-top: 80px; /* Spazio per la navbar fissa */
        }

        /* Hero Header */
        .dates-hero {
            position: relative;
            width: 100%;
            height: 350px;
            background: url('images/hero.png') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
        }

        .dates-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(6,9,25,0.95) 0%, rgba(6,9,25,0.3) 100%);
        }

        .dates-hero h1 {
            position: relative;
            z-index: 2;
            font-size: 3.5rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
            color: #ffffff;
        }

        /* Widget QR / Sync Calendario Smartphone */
        .calendar-sync-box {
            position: relative;
            z-index: 2;
            background: #ffffff;
            color: #111;
            padding: 15px 25px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .calendar-sync-box p {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.2;
        }

        .sync-icons {
            display: flex;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 900;
        }

        /* Contenitore Tabella */
        .dates-container {
            max-width: 1100px;
            margin: 40px auto 60px;
            padding: 0 20px;
        }

        .notice-text {
            font-size: 0.8rem;
            color: #aaaaaa;
            margin-bottom: 15px;
            font-style: italic;
        }

        .dates-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            color: #111111;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .dates-table th {
            background-color: #060919;
            color: #ffffff;
            text-align: left;
            padding: 18px 20px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dates-table td {
            padding: 18px 20px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.95rem;
        }

        .dates-table tr:last-child td {
            border-bottom: none;
        }

        .dates-table tr:hover {
            background-color: #f4f6fc;
        }

        .match-date {
            font-weight: 800;
            color: #060919;
            white-space: nowrap;
        }

        .match-time {
            font-weight: 800;
            color: #002288;
            white-space: nowrap;
        }

        .match-description {
            font-weight: 700;
            color: #333333;
        }

        .match-subtext {
            font-size: 0.8rem;
            color: #666666;
            margin-top: 3px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dates-hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
                height: auto;
            }
            .dates-table th, .dates-table td {
                padding: 12px 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body class="not-top-page">

    <div id="navbar-container"></div>

 

    <!-- HERO HEADER -->
    <section class="dates-hero">
        <h1>Tutte le Date</h1>

</html>
