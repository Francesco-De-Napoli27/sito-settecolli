<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica Maschile - Polisportiva Acli Settecolli</title>
    <link rel="icon" href="images/Logo nuovo Settecolli_favicon.png type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #060919; color: #ffffff; margin: 0; padding-top: 80px; font-family: 'Segoe UI', sans-serif; }
        .page-hero { background-color: #060919; padding: 50px 40px; border-bottom: 2px solid #ff2800; }
        .page-hero h1 { max-width: 1300px; margin: 0 auto; font-size: 2.8rem; text-transform: uppercase; font-weight: 900; }
        .page-container { max-width: 1300px; margin: 0 auto; padding: 60px 20px; }
        
        table { width: 100%; border-collapse: collapse; background-color: #0d1326; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-bottom: 30px; }
        th, td { padding: 14px 16px; text-align: center; font-size: 0.95rem; }
        th { background-color: #111832; color: #ffc107; text-transform: uppercase; font-weight: 800; border-bottom: 2px solid rgba(255,255,255,0.1); }
        td { border-bottom: 1px solid rgba(255,255,255,0.05); color: #fff; }
        td:nth-child(2) { text-align: left; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        td img { width: 24px; height: 24px; object-fit: contain; }
        tr:hover { background-color: rgba(255,255,255,0.03); }

        .back-btn { display: inline-block; background-color: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 10px 24px; font-weight: bold; text-transform: uppercase; border-radius: 4px; text-decoration: none; transition: 0.3s; }
        .back-btn:hover { background-color: #ff2800; border-color: #ff2800; }
    </style>
</head>
<body class="not-top-page">

   <div id="navbar-container"></div>




    <section class="page-hero">
        <h1>Classifica Serie D - Femminile</h1>
    </section>

    <div class="page-container">
        <div id="classifica-femminile">Caricamento classifica in corso...</div>

        <div style="margin-top: 40px;">
            <a href="index.html" class="back-btn">Torna alla Home</a>
        </div>
    </div>

    <script>
        async function caricaClassificaFemminile() {
            const container = document.getElementById("classifica-femminile");
            try {
                const response = await fetch("classifica_femminile.json");
                const data = await response.json();

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Pos</th><th style="text-align:left;">Squadra</th><th>Pt</th><th>G</th><th>GV</th><th>GP</th><th>SV</th><th>SP</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.forEach(team => {
                    html += `
                        <tr>
                            <td><strong>${team.posizione}</strong></td>
                            <td><img src="${team.logo}" alt="logo"> ${team.squadra}</td>
                            <td><strong>${team.punti}</strong></td>
                            <td>${team.giocate}</td>
                            <td>${team["giocate vinte"]}</td>
                            <td>${team["giocate perse"]}</td>
                            <td>${team["set vinti"]}</td>
                            <td>${team["set persi"]}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (error) {
                console.error("Errore:", error);
                container.innerHTML = "<p>Impossibile caricare la classifica al momento.</p>";
            }
        }
        document.addEventListener("DOMContentLoaded", caricaClassificaFemminile);
    </script>

    <div id="footer-container"></div>

    <!-- SCRIPT -->
    <script src="script.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
