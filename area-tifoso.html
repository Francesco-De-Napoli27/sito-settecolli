<head>

</head>

<body class="contatti-staff">

<!-- NAVBAR (IDENTICA A PRIMA) -->
<header class="navbar">
  <div class="navbar-left">
    <a href="index.html" class="logo-link">
      <img src="images/logo settecolli.png" alt="Logo" class="logo" />
    </a>
  </div>

  <nav class="navbar-center">
    <ul class="nav-menu" id="navMenu">
      <li><a href="index.html">Home</a></li>
      <li><a href="staff.html">Staff</a></li>
      <li><a href="team.html">Team</a></li>
      <li><a href="notizie.html">Notizie</a></li>
      <li><a href="sponsor.html">Sponsor</a></li>
      <li><a href="tv.html">Settecolli TV</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="galleria.html">Galleria</a></li>
      <li><a href="contatti.html">Contatti</a></li>
    </ul>
  </nav>

  <div class="navbar-right">
    <div class="login-wrapper">
      <a href="#" class="login-icon" id="user-icon">👤</a>
      <div class="dropdown-login" id="user-dropdown" style="display: none;">
        <a href="area-riservata.html">Gestione Account</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</header>

<!-- HERO -->
<section class="hero hero-login">
  <img src="images/hero.png" alt="Polisportiva Acli Settecolli" class="hero-image">
</section>

<!-- CONTENUTO AREA TIFOSO -->
<div class="contatti-wrapper">
  <div class="contatti-testo">
    <h2>Area Tifoso</h2>
    <p>Benvenuto nella tua area personale.</p>
  </div>

  <div class="contatti-form">
    <button onclick="logout()">Esci</button>
  </div>
</div>

<!-- SCRIPT AUTENTICAZIONE + RUOLO -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDRf3Q_-D7nsVIPKSxxIm78rz1Nn5QY1cQ",
    authDomain: "settecollisite.firebaseapp.com",
    projectId: "settecollisite",
    storageBucket: "settecollisite.firebasestorage.app",
    messagingSenderId: "928590715316",
    appId: "1:928590715316:web:031eae061e38bd5ef9bae1",
    measurementId: "G-HG7C6G0ZPV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Protezione pagina: SOLO tifoso
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists() || snap.data().role !== "tifoso") {
      window.location.href = "area-riservata.html";
    }
  });

  // Logout
  window.logout = function () {
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  };

  // Dropdown utente
  const userIcon = document.getElementById("user-icon");
  const userDropdown = document.getElementById("user-dropdown");

  userIcon.addEventListener("click", () => {
    userDropdown.style.display =
      userDropdown.style.display === "block" ? "none" : "block";
  });
</script>

</body>
</html>
