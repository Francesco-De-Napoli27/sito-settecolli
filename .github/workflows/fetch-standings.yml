name: Aggiorna Classifiche FIPAV

on:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 06:00 UTC (~07:00 italiane)
  workflow_dispatch:        # permette di lanciarla manualmente

permissions:
  contents: write           # necessario per fare commit/push

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: |
          npm ci || npm install

      - name: Esegui script (genera i JSON)
        run: |
          npm run fetch:all
          echo "--- Contenuto repo dopo lo script ---"
          ls -la
          echo "public/ (se esiste):"
          ls -la public || true

      - name: Allinea con il branch remoto
        run: |
          git config pull.rebase true
          git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true

      - name: Commit & Push dei JSON aggiornati
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Aggiornamento automatico classifiche [skip ci]" || echo "Nessuna modifica da committare"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
