name: Aggiorna Classifiche FIPAV

on:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del branch main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mostra info contesto
        run: |
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          git branch -a
          git status
          echo "== ls (prima) =="
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze npm
        run: npm ci || npm install

      - name: Installa browser per Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Mostra config scraper
        run: |
          echo "== scripts/standings.config.json =="
          cat scripts/standings.config.json

      - name: Esegui scraper (genera JSON in root)
        run: |
          npm run fetch:all
          echo "== ls (dopo scraper) =="
          ls -la
          echo "== ls public (se esiste) =="
          ls -la public || true

      - name: Verifica output (deve stare in root)
        run: |
          set -e
          for f in classifica_maschile.json classifica_femminile.json classifica_under18f.json; do
            if [ -f "$f" ]; then
              echo "✅ trovato $f"
            else
              echo "❌ MANCANTE: $f"
              echo "Suggerimento: controlla 'out' in scripts/standings.config.json e gli URL FIPAV."
              exit 1
            fi
          done

      - name: Allinea con remoto (rebase)
        run: |
          git config pull.rebase true
          git pull --rebase origin main || true

      - name: Commit & Push dei JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Aggiornamento automatico classifiche [skip ci]" || echo "Nessuna modifica"
          git push origin HEAD:main


