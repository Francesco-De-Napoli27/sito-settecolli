<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settecolli TV - Polisportiva Acli Settecolli</title>
    <link rel="icon" href="images/Logo nuovo Settecolli.png" type="image/png">
    <link rel="stylesheet" href="style.css">
      <style>
    /* Stili specifici per la pagina Contatti Istituzionale */
    body, .tv-hero, .tv-live-section, .interviste-section{
      background-color: #ffffff; /* Sfondo bianco come da riferimento */
      color: #111111;
      margin: 0;
      padding-top: 50px; /* Spazio per la navbar fissa */
      background-image: none !important;
    }

    /* Hero Header TV */
    .tv-hero {
      background-color: #060919;
      padding: 60px 40px;
      text-align: left;
    }

    .tv-hero h1 {
      max-width: 1200px;
      margin: 0 auto;
      font-size: 4rem;
      text-transform: uppercase;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
    }
    .tv-live-section{
      background-color: #060919;
    }
    .interviste-section{
      background-color: #060919;
    }
  </style>
</head>
<body class="not-top-page">



    <div id="navbar-container"></div>

   


   <!-- HERO HEADER TV -->
   <section class="tv-hero">
      <h1>SETTECOLLI TV</h1>
   </section>

    <!-- SEZIONE TV & INTERVISTE -->
    <section class="tv-live-section">
      <div class="tv-container">
        <div class="tv-video">
          <iframe width="100%" height="400" src="https://www.youtube.com/embed/DPHeWEdPeZ4?autoplay=1&mute=1" 
            title="Diretta Settecolli TV"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
        <div class="tv-chat">
          <iframe width="100%" height="400" src="https://www.youtube.com/live_chat?v=DPHeWEdPeZ4&embed_domain=www.aclisettecolli.it"
            frameborder="0">
          </iframe>
        </div>
      </div>

      <div class="interviste-section">
        <h2>Interviste 🎤</h2>
        <div class="interviste-grid">
           <div class="tv-video-card">
                <iframe src="https://youtube.com/embed/RJS3_p0oHvg" title="YouTube video" allowfullscreen></iframe>
                <div class="tv-video-info">Settecolli TV | Nasce il Network Sportivo Settecolli!</div>
            </div>
        </div>
      </div>
    </section>

    <div id="footer-container"></div>

    
    <!-- SCRIPT -->
    <script src="script.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
